# Redis on the box (docs/phase1-m3-spec.md §6.5, contracts §2, §6). Mounted read-only at
# /usr/local/etc/redis/redis.conf. TLS only, a password, durable, never evicting.
#
# The password and the certificates are secret files `loom-deploy apply` renders under
# /run/loom/secrets/redis (a tmpfs); requirepass is in the included file, never here.

# No plaintext port; TLS on 6379 (the services' rediss:// URLs name Loom's own CA).
port 0
tls-port 6379
tls-cert-file /run/loom/secrets/redis/server.crt
tls-key-file /run/loom/secrets/redis/server.key
tls-ca-cert-file /run/loom/secrets/redis/ca.crt
# The password is the authentication; clients present no certificate.
tls-auth-clients no
tls-protocols "TLSv1.2 TLSv1.3"
include /run/loom/secrets/redis/requirepass.conf

# AOF with an fsync every second, as in M1's compose file; a balance or a reservation key
# evicted would be wrong, not slow (contracts §6).
dir /data
appendonly yes
appendfsync everysec
maxmemory 1gb
maxmemory-policy noeviction

# The container's stdout is the log (awslogs).
logfile ""
