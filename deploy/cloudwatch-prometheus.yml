# The CloudWatch agent's Prometheus scrape configuration (docs/phase1-m3-spec.md §6.9):
# the host scrapes the metrics ports the compose file binds to 127.0.0.1. The agent's
# config (cloudwatch-agent.json) names this file and the series it sends. The job names
# are the ones alarm H1 reads (`up{job=...}`).
global:
  scrape_interval: 60s
  scrape_timeout: 10s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["127.0.0.1:9100"]
  - job_name: billing
    static_configs:
      - targets: ["127.0.0.1:9101"]
  - job_name: poolmgr
    static_configs:
      - targets: ["127.0.0.1:9102"]
