[project]
name = "loom-bench"
version = "0.1.0"
description = "Loom Benchmark Lab: reproducible cost, latency, throughput and quality benchmarks for open-weight LLM serving"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.13",
    "typer>=0.12",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pyarrow>=17",
    "jinja2>=3.1",
    "jsonschema>=4.23",
    "tokenizers>=0.20",
    "huggingface-hub>=0.25",
]

[project.optional-dependencies]
mock = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "prometheus-client>=0.20"]
aws = ["boto3>=1.35"]
lmeval = ["lm-eval[api,ifeval,ruler]==0.4.13", "transformers>=4.45"]

[project.scripts]
bench = "loom_bench.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loom_bench"]
