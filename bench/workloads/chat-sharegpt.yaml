name: chat-sharegpt
description: >-
  Multi-turn chat from ShareGPT-format conversations; history becomes the
  messages and the reference reply sets the output length. The dataset is not
  shipped: download it, check its terms, and set LOOM_DATA_DIR (or override path).
kind: chat_dataset
content: realistic
endpoint: chat
path: ${LOOM_DATA_DIR}/sharegpt/ShareGPT_V3_unfiltered_cleaned_split.json
max_input_len: 4096
min_output_len: 4
max_output_len: 1024
ignore_eos: true
seed: 0
dataset:
  name: ShareGPT_Vicuna_unfiltered (ShareGPT_V3_unfiltered_cleaned_split.json)
  source: https://huggingface.co/datasets/anon8231489123/ShareGPT_Vicuna_unfiltered
  revision: null  # pin the HF commit you downloaded before publishing results
  license: >-
    ShareGPT terms note: conversations scraped from sharegpt.com contain ChatGPT
    outputs, and the HF card's license does not settle OpenAI's terms of use.
    Verify before publishing.
  license_url: https://huggingface.co/datasets/anon8231489123/ShareGPT_Vicuna_unfiltered
