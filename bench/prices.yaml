# Cloud prices used for every cost number the Benchmark Lab reports.
# Maintained by hand from public price pages; each entry records its sources and
# the date it was checked. Validated by loom_bench.prices.
#
# Money is integer micro-dollars: on_demand_per_hour: 1_861_000 means $1.861/hour.
# Spot prices are indicative only: the average across us-east-1 AZs in a vantage.sh
# snapshot. Spot moves by the hour, so a run's spend records the price it used.
# Entries with `verified: false` are refused by cost math unless explicitly allowed.
#
# RunPod has no regions to price: its "region" here is the cloud type (secure), and
# instance names (l40s-x1, ...) are Loom's names for a GPU type x count. RunPod picks
# the datacenter; the provider accrues at max(the pod's API costPerHr, this price).

last_checked: 2026-10-08

