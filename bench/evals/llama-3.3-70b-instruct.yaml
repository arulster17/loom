# Pinned quality suite for Llama 3.3 70B Instruct (loom_bench.quality.suite; method in
# docs/quality-gate.md).
#
# Same structure and sample-size reasoning as qwen3-8b.yaml. With n paired items and a
# share d of items flipping between baseline and candidate, the 95% CI half-width of the
# paired delta is about 1.96 * sqrt(d / n), never below 3/n:
#
#     n      d=2%     d=5%    floor 3/n
#     60     3.6 pts  5.7     5.0
#     400    1.4      2.2     0.75
#     541    1.2      1.9     0.55
#     664    1.1      1.7     0.45
#     1000   0.9      1.4     0.30
#     1319   0.8      1.2     0.23
#     2100   0.6      1.0     0.14
#
# Changing anything here changes what is measured: rerun the baseline.

suite: llama-3.3-70b-instruct
model: llama-3.3-70b-instruct
# The FP8 checkpoint runs this same suite and is gated against the BF16 baseline.
also_models: [llama-3.3-70b-instruct-fp8]
seed: 1234

gate:
  threshold: 0.01
  min_samples: 300
  confidence: 0.95
  n_boot: 10000
  inconclusive_blocks: true
  review_blocks: false     # REVIEW is reported, not blocking

tasks:
  # MMLU-Pro: 150 docs per subject x 14 = 2100 items. d=5% -> ±0.96 pts.
  - name: mmlu_pro
    kind: lm_eval
    items: 2100  # for the planner; lm_eval counts its docs at run time
    params:
      tasks: [mmlu_pro]
      limit: 150
      metric: exact_match
      filter: custom-extract
      num_concurrent: 32

  # GSM8K: full test split (1319), 8-shot CoT in the Llama 3 evaluation format.
  # d=2% -> ±0.76 pts.
  - name: gsm8k
    kind: lm_eval
    items: 1319  # for the planner; lm_eval counts its docs at run time
    params:
      tasks: [gsm8k_cot_llama]
      metric: exact_match
      filter: flexible-extract
      fewshot_as_multiturn: true
      gen_kwargs: {max_gen_toks: 1024}
      num_concurrent: 32

  # IFEval: all 541 prompts; d=5% -> ±1.9 pts, decided at 2 points.
  - name: ifeval
    kind: lm_eval
    items: 541  # for the planner; lm_eval counts its docs at run time
    threshold: 0.02
    params:
      tasks: [ifeval]
      metric: prompt_level_strict_acc
      num_concurrent: 32

  # RULER niah_single_2 at 4k and 16k tokens, 500 docs per length = 1000 items.
  # d=2% -> ±0.88 pts. The tokenizer comes from the gated meta-llama repo: an HF token
  # locally; on aws_ec2 the host's read-only snapshot of the model (docs/aws-setup.md).
  # Lengths stay inside the served window (max_context 32768 in config/models.yaml); a
  # context-extension change extends this list.
  - name: ruler_niah
    kind: lm_eval
    items: 1000  # for the planner; lm_eval counts its docs at run time
    params:
      tasks: [niah_single_2]
      api: completions
      apply_chat_template: false
      metric_from_doc: max_length
      metadata:
        max_seq_lengths: [4096, 16384]
        tokenizer: meta-llama/Llama-3.3-70B-Instruct
      model_args: {tokenized_requests: false, tokenizer_backend: null, max_length: 32768}
      num_concurrent: 16

  # Native needle at 8k and 28k tokens: 2 x 5 depths x 40 = 400 items, decided at 2 points.
  - name: needle
    kind: needle
    threshold: 0.02
    params:
      context_tokens: [8192, 28672]
      depths: [0.1, 0.3, 0.5, 0.7, 0.9]
      samples_per_cell: 40
      seed: 1234

  # HumanEval + MBPP: 664 sandboxed programs (needs allow_code_exec), decided at 2 points.
  - name: code
    kind: code_exec
    threshold: 0.02
    params:
      datasets: [humaneval, mbpp]
      max_tokens: 1024

  # Tool calling: 60 pinned items, floor 3/60 = 5 pts, decided at 6 points (catches broken
  # parsers and chat templates).
  - name: tool_calling
    kind: tool_calling
    threshold: 0.06
    min_samples: 50
  # Strict-mode variant: the same 60 items, every tool sent `strict: true` (vLLM then
  # constrains the arguments, so numbers cannot come back as strings). Reported next to
  # tool_calling, which stays the headline; same margin.
  - name: tool_calling_strict
    kind: tool_calling_strict
    threshold: 0.06
    min_samples: 50
  # JSON schema: 300 pinned items (data version 2), floor 1 pt, decided at 3 points; the
  # sizing is in qwen3-8b.yaml.
  - name: json_schema
    kind: json_schema
    threshold: 0.03
    min_samples: 250

# Teacher-forced divergence vs the BF16 reference: 48 pinned prompts x 64 tokens, top-5.
# Limits calibrated on the baseline's own noise floor, measured each run at
# floor_concurrency 1; the reasoning behind each value is in qwen3-8b.yaml.
#
# hard_prompts: Llama 3's 128k byte-level vocabulary keeps " √" and common CJK whole (they
# split under Qwen3) but splits " ∛", " ∑", " ∫", " ÷" and a word-initial " ß" or " ñ"
# (checked with the real tokenizer, bench/tests/quality/test_divergence_llama.py). In the
# first real Llama capture (70B run cf4d1614) no echoed continuation token splits a
# character, but the top-5 alternatives hold incomplete-UTF-8 fragments (vLLM renders them
# "") at 3 positions of prompt 16 (a speed calculation; rank 2 at logprob -1.28) and 1 each
# of prompts 2 and 40 - the per-token rendering a cross-engine comparison must align. These
# are the hard prompts, most split positions first; the evidence is pinned in
# bench/tests/quality/fixtures/divergence_llama33_splits.json. A limited suite always
# scores them.
divergence:
  top_k: 5
  max_new_tokens: 64
  hard_prompts: [16, 2, 40]
  floor_concurrency: 1
  noise_multiple: 5.0
  max_kl: 0.05
  min_top1: 0.95
  ceiling_kl: 0.5
  ceiling_top1: 0.80

sanity_limits:
  max_empty: 0.01
  max_truncated: 0.02
  max_repetition: 0.02
  max_language_drift: 0.02

# Phase 0 subset (`quality.subset: phase0` in bench/experiments/): the tasks that fit both
# Phase 0 leaderboard runs inside their host TTL and budget (bench plan prices the eval at
# items x EVAL_ITEM_S per task kind, plan.py). Each task keeps its full pinned items, so the
# half-widths above hold for it and its results pair item for item with a full-suite run.
# GSM8K (long chain-of-thought generation), IFEval (chat template and instruction
# following), tool calling and JSON schema (the engines' tool parsers and grammar
# backends) cover what an engine change breaks most often; divergence and the sanity
# checks always run. Not measured in Phase 0, so their CIs are unbounded until a full-suite
# run: mmlu_pro (~26 min per config), ruler_niah (~26 min), needle (~17 min) and code (~11
# min; it also needs allow_code_exec).
#
# phase0-strict adds tool_calling_strict (60 items, ~1 min) to phase0: the FP8 runs use it.
# Gated against a phase0 baseline from an earlier experiment (BF16 run cf4d1614), the four
# shared tasks pair item for item and the strict task is reported, not gated; a run that
# carries its own BF16 baseline (the H100 run) gates it too.
subsets:
  phase0: [gsm8k, ifeval, tool_calling, json_schema]
  phase0-strict: [gsm8k, ifeval, tool_calling, tool_calling_strict, json_schema]
