# Spend caps for the Benchmark Lab, enforced by loom_bench.budget.
#
# - per_experiment_cap: no experiment may set budget.max_spend above this.
# - overall_cap: total billable spend across every experiment in the results DB.
#   Simulated spend (provider kind `mock`) is recorded but never counts toward it.
#
# `bench run` refuses to start when the plan's estimate, or the worst case of every
# host living to its TTL, exceeds the effective cap:
#   min(budget.max_spend, per_experiment_cap, overall_cap - billable spend so far).
#
# Spend made outside the results DB (e.g. the 2026-10-06 RunPod spike, ~$0.07) is not
# recorded in `bench_spend`, so overall_cap is lowered by hand to stay at or below the
# real prepaid RunPod balance.
overall_cap: "$149.75"
per_experiment_cap: "$50"
