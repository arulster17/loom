# Phase 0 leaderboard #2 on RunPod: Llama 3.3 70B Instruct (BF16, ~141 GB) with TP=4 on
# one RunPod Secure Cloud 4x L40S pod (on-demand), vLLM v0.30.0 at defaults. The 250 GB
# container disk holds the weights plus engine headroom (no network volume). Needs the
# RunPod secret hf_token to carry an HF token with the Llama 3.3 license accepted.
#
# Same variants, workloads, SLO and quality as the AWS spec (llama-3.3-70b-tp4.yaml).
#
# Each workload searches the open-loop rate geometrically (x2 from `lo` until a rate
# fails, then log-scale bisection). Ranges are scaled down from the measured Qwen3-8B
# 1x L40S capacity (fixed-1k-1k ~1.2-1.9 req/s): a 70B model at TP=4 is expected to
# sustain no more, so `hi` sits well above the expected knee without long overload.
# `descend: 2` steps down to lo/2 and lo/4 if `lo` itself fails the conservative verdict.
name: llama-3.3-70b-tp4-runpod
description: Llama 3.3 70B BF16, TP=4 on RunPod Secure 4x L40S, vLLM v0.30.0, rate sweeps at SLO.
model: llama-3.3-70b-instruct
provider:
  kind: runpod
  container_disk_gb: 250
  # 4x L40S pods can span both CPU sockets (874110b6: GPU0 on socket 0, SYS links),
  # where NCCL P2P is reported available but init hangs; a 4-rank all_reduce hung by
  # default and passed with this set. vLLM already disables its custom all-reduce on
  # more than two PCIe-only GPUs, so NCCL is the only P2P user.
  engine_env: {NCCL_P2P_DISABLE: "1"}
variants:
  # EAGLE3 speculative decoding: a 4.9 GB draft head proposes 3 tokens per step and the
  # target model verifies them, so outputs keep the target's distribution (vLLM's
  # rejection sampling is lossless; same BF16 weights). Why: at defaults the per-token
  # floor is ~60 ms (cf4d1614: TPOT p95 >= 60.3 ms at any load). One step reads 35 GB of
  # weights per GPU at 864 GB/s (>= 41 ms) plus ~4.4 ms of NCCL all-reduce with P2P off,
  # so no NCCL or scheduler knob reaches 50 ms. The 2026-10-08 tuning pod (same image,
  # cross-socket 4x L40S) measured fixed-1k-1k at 0.25 req/s: TPOT p95 77.3 ms at
  # defaults, 47.1 ms with this (mean 2.28 tokens accepted per step; 2 draft tokens:
  # 46.4 ms). Some random-word continuations accept few drafts and run at the ~60 ms
  # floor, so the TPOT tail depends on the content. Costs KV room: 41k cached tokens
  # instead of 71k. docs/benchmark-lab.md "70B tuning".
  - name: vllm-tp4-eagle3
    engine:
      args:
        speculative_config:
          method: eagle3
          model: RedHatAI/Llama-3.3-70B-Instruct-speculator.eagle3
          revision: 42864f78d503693ae5fd317419f099ab3b7c13e4
          num_speculative_tokens: 3
workloads:
  - profile: fixed-1k-1k
    load:
      mode: open_loop
      search: {lo: 0.25, hi: 2, rel_tol: 0.15, max_points: 4, scale: geometric, descend: 2}
      duration_s: 180
      warmup_s: 30
      drain_timeout_s: 90
  - profile: shared-prefix
    load:
      mode: open_loop
      search: {lo: 0.5, hi: 4, rel_tol: 0.15, max_points: 4, scale: geometric, descend: 2}
      duration_s: 120
      warmup_s: 20
      drain_timeout_s: 30
repetitions: 3
slo:
  ttft_ms: {p95: 1000}
  tpot_ms: {p95: 50}
  max_error_rate: 0.01
# Quality: one config, so nothing is gated; the suite's Phase 0 subset records the BF16
# baseline scores, and the captured divergence reference (results/<experiment>/evals/)
# is what later candidates of this model (FP8, other engines) are scored against.
quality:
  suite: llama-3.3-70b-instruct
  subset: phase0
  baseline_variant: vllm-tp4-eagle3
# The pod's TTL: `bench plan` puts it at ~2.7 h; the real 141 GB download took ~5 min
# (874110b6), so 3.5 h leaves ~30% margin. Worst case to TTL is ~$15.4, which fits the
# 70B work's $20 total after the hung first attempt and its diagnosis (~$3.1). 4x L40S Secure stock is scarce (none listed on 2026-10-07): check it before
# launching and run with LOOM_RUNPOD_CAPACITY_WAIT_S=7200 so a stock refusal waits up to
# 2 h instead of 30 min (nothing is billed while waiting; docs/runbook-runpod.md).
budget:
  max_spend: "$20"
  ttl_minutes: 210
  accrual_interval_s: 15
seed: 0
