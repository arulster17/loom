# APPROVED 2026-10-08, with the run it smokes: run this smoke first ($9 cap), then
# llama-3.3-70b-h100-tp2-runpod.yaml ($45 cap).
#
# The H100 run's paths at smoke scale on one RunPod Secure 2x H100 SXM pod ($7.98/h on
# 2026-10-08): Qwen3-8B BF16 (baseline, captures the divergence reference) and RedHatAI's
# FP8-dynamic Qwen3-8B (made like the 70B FP8 checkpoint) at TP=2. What it runs that
# runpod-smoke-fp8 (1x L40S) does not: the H100 SXM GPU type id and price entry, sm_90
# FP8 GEMMs, TP=2 with NCCL peer-to-peer over NVLink (NCCL_P2P_LEVEL=NVL; the L40S runs
# disable P2P) and vLLM's custom all-reduce, which it enables on 2 NVLinked GPUs, and
# gpu_memory_utilization 0.95. Same load shapes, repetitions, SLO and quality subset as
# the H100 run, with an in-run BF16 baseline as there. The 70B weights (141 GB + 73 GB)
# and the BF16 KV-cache margin at 0.95 are what it cannot run.
name: runpod-smoke-h100
description: "The 70B H100 run's paths at smoke scale on 2x H100 SXM (Qwen3-8B BF16 vs FP8-dynamic, TP=2)."
model: qwen3-8b
smoke: true
provider:
  kind: runpod
  instance_type: h100-sxm-x2
  gpu_type_id: NVIDIA H100 80GB HBM3
  container_disk_gb: 80
  engine_env: {NCCL_P2P_LEVEL: NVL}
variants:
  - name: vllm-tp2
    hardware: {gpu: H100, gpus_per_replica: 2}
    parallelism: {tp: 2}
    engine:
      args: {gpu_memory_utilization: 0.95}
  # The FP8 registry row (qwen3-8b-fp8, RedHatAI/Qwen3-8B-FP8-dynamic), served by
  # naming it as the 70B run's FP8 cell names llama-3.3-70b-instruct-fp8 (`Variant.model`:
  # its own served id, suite lookup through also_models, report and site row).
  - name: vllm-tp2-fp8
    model: qwen3-8b-fp8
    hardware: {gpu: H100, gpus_per_replica: 2}
    parallelism: {tp: 2}
    engine:
      args: {gpu_memory_utilization: 0.95}
workloads:
  - profile: fixed-1k-1k
    overrides: {output_len: 128}
    load:
      mode: open_loop
      search: {lo: 0.5, hi: 1, rel_tol: 0.1, max_points: 2, scale: geometric, descend: 1}
      duration_s: 10
      warmup_s: 2
      drain_timeout_s: 15
  - profile: shared-prefix
    overrides: {output_len: 32}
    load:
      mode: open_loop
      search: {lo: 1, hi: 2, rel_tol: 0.1, max_points: 2, scale: geometric, descend: 1}
      duration_s: 10
      warmup_s: 2
      drain_timeout_s: 15
repetitions: 3
slo:
  ttft_ms: {p95: 1000}
  tpot_ms: {p95: 50}
  max_error_rate: 0.01
quality:
  suite: qwen3-8b
  subset: phase0-strict
  baseline_variant: vllm-tp2
  limit: 4
budget:
  max_spend: "$9"
  ttl_minutes: 65
  accrual_interval_s: 15
seed: 0
