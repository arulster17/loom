# PROPOSED 2026-11-02, NOT APPROVED, NOT RUN. Do not launch without the user's approval.
# The AWS twin of qwen3-8b-profile-runpod.yaml (design, shape and config-hash notes there;
# explainer docs/perf/roofline-and-profiling.md): Qwen3-8B bf16 and fp8-kv8 at known
# batch sizes and chat goodput, a torch-profiler window per load point, one host, the
# fp8-kv8 cell through a warm restart.
#
# Why AWS: RunPod Secure 1x L40S was out of stock all of 2026-11-02 (191 refused creates,
# supply, not the request). The account's AWS us-east-1 on-demand G/VT quota (4 vCPU;
# spot 0) fits exactly one g6e.xlarge: the same L40S 48 GB, with 4 vCPU and 32 GiB of RAM
# (the pod had 16 vCPU and 94 GiB), at $1.861/h plus 200 GB gp3. Pinned to g6e.xlarge, no
# fallback. Only the provider block, the budget and what the host forces differ from the
# RunPod original, which keeps the design notes; config hashes differ (the hardware is in
# them). bench/tests/aws/test_aws_perf_track.py fails if this, its twin or their RunPod
# originals drift apart.
#
# Smoke first: aws-smoke-profile.yaml.
#
# bench plan (2026-11-02, against a copy of the results DB): one host, 2.29 h of a
# 2.75 h TTL, estimate $4.32; worst case (the host lives to its TTL) $5.18; cap $5.25.
name: qwen3-8b-profile-aws
description: Qwen3-8B bf16 vs fp8-kv8 on RunPod 1x L40S at known batch sizes and chat goodput, with a torch-profiler window per load point.
model: qwen3-8b
provider:
  kind: aws_ec2
  region: us-east-1
  instance_type: g6e.xlarge
  market: on_demand
  disk_gb: 200
variants:
  - name: bf16
    engine:
      args:
        profiler_config:
          profiler: torch
          torch_profiler_dir: /var/lib/loom/profiles
          torch_profiler_with_stack: false
          torch_profiler_record_shapes: false
          torch_profiler_with_memory: false
          torch_profiler_use_gzip: true
          torch_profiler_dump_cuda_time_total: false
  - name: fp8-kv8
    model: qwen3-8b-fp8
    kv_cache_dtype: fp8
    engine:
      args:
        profiler_config:
          profiler: torch
          torch_profiler_dir: /var/lib/loom/profiles
          torch_profiler_with_stack: false
          torch_profiler_record_shapes: false
          torch_profiler_with_memory: false
          torch_profiler_use_gzip: true
          torch_profiler_dump_cuda_time_total: false
workloads:
  - profile: fixed-1k-1k
    load:
      mode: closed_loop
      values: [1, 16, 64]
      duration_s: 150
      warmup_requests: 2
      drain_timeout_s: 60
  - profile: chat-sharegpt
    load:
      mode: open_loop
      values: [2.213, 5.239]
      duration_s: 210
      warmup_s: 45
      drain_timeout_s: 60
repetitions: 2
slo:
  ttft_ms: {p95: 1000}
  tpot_ms: {p95: 50}
  max_error_rate: 0.01
profile:
  windows:
    - workload: fixed-1k-1k
    - workload: chat-sharegpt
  settle_s: 45
  capture_s: 20
  max_iterations: 200
  tail_s: 5
  drain_timeout_s: 15
  trace_dir: /var/lib/loom/profiles
  max_trace_mb: 256
budget:
  max_spend: "$5.25"
  ttl_minutes: 165
  accrual_interval_s: 15
seed: 0
