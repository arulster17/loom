# Phase 0 leaderboard #1 on RunPod: Qwen3-8B (BF16) on one RunPod Secure Cloud 1x L40S
# pod per engine (on-demand), vLLM vs SGLang at engine defaults (prefix caching on in
# both). A pod runs one engine image, so each engine gets its own pod and its own honest
# cold start; the two pods run one after the other, not side by side. The datacenter is
# RunPod's choice and is recorded per run (price_basis.availability_zone).
#
# Same variants, workloads, SLO and quality gate as the AWS spec
# (qwen3-8b-vllm-vs-sglang.yaml), 3 repetitions per point. Image digests: research notes
# of 2026-10-04.
#
# Each workload searches the open-loop rate for the highest load meeting the SLO,
# geometrically: it climbs x2 from `lo` until a rate fails, then bisects on a log
# scale, so few points land in overload (the slowest points to run). The ranges fit
# one L40S: the first RunPod sweep (058128e9, vLLM) passed fixed-1k-1k at 1.22 and
# failed at 1.94 req/s, and passed shared-prefix and code-completion at 1 but failed
# them at 4.88 and 6.88. Those two start at 1 req/s, the rate known to pass; 5 points
# (the most the AWS twin's 8 h TTL cap allows) bracket a knee near 4-6 req/s to ~40%.
# The pass verdict is conservative (CI upper bound over 3 reps), so a first point can
# fail with easy raw latencies: `descend: 2` then steps down to lo/2 and lo/4 before
# giving up, instead of ending the workload with no goodput.
name: qwen3-8b-vllm-vs-sglang-runpod
description: Qwen3-8B BF16 on RunPod Secure 1x L40S, vLLM v0.30.0 vs SGLang v0.5.21, rate sweeps at SLO.
model: qwen3-8b
provider:
  kind: runpod
  container_disk_gb: 80
variants:
  - name: vllm
    engine:
      name: vllm
      version: "0.30.0"
      image: vllm/vllm-openai@sha256:8a69ffad015f138d7170c4ddc429e230a3bc1c1719f67e14324749df200a4b90
  - name: sglang
    engine:
      name: sglang
      version: "0.5.21"
      image: lmsysorg/sglang@sha256:b1259f3ea3275f66237c498ea388919729018bc9f01c3d638391e06e2cf3f469
workloads:
  - profile: fixed-1k-1k
    load:
      mode: open_loop
      search: {lo: 0.5, hi: 4, rel_tol: 0.1, max_points: 6, scale: geometric, descend: 2}
      duration_s: 180
      warmup_s: 30
      drain_timeout_s: 60
  - profile: shared-prefix
    load:
      mode: open_loop
      search: {lo: 1, hi: 8, rel_tol: 0.1, max_points: 5, scale: geometric, descend: 2}
      duration_s: 120
      warmup_s: 20
      drain_timeout_s: 30
  - profile: code-completion
    load:
      mode: open_loop
      search: {lo: 1, hi: 8, rel_tol: 0.1, max_points: 5, scale: geometric, descend: 2}
      duration_s: 120
      warmup_s: 20
      drain_timeout_s: 30
repetitions: 3
slo:
  ttft_ms: {p95: 1000}
  tpot_ms: {p95: 50}
  max_error_rate: 0.01
# Quality (docs/quality-gate.md): switching engine can change outputs, so SGLang is gated
# against vLLM BF16, which also serves as the BF16 divergence reference. Both run the suite's
# Phase 0 subset as an eval job on the host after their load runs; vLLM captures the
# reference logprobs and SGLang is scored against them when its engine is up.
quality:
  suite: qwen3-8b
  subset: phase0
  baseline_variant: vllm
# Each pod's TTL: `bench plan` puts one pod at ~3.6 h (cold start, 3 sweeps with every
# search using all its points, eval), so 6 h leaves ~65% margin while keeping the worst
# case (both pods to TTL) near $13.
# max_spend $15: the approved real-spend limit for the first RunPod sweep, just above
# that worst case.
budget:
  max_spend: "$15"
  ttl_minutes: 360
  accrual_interval_s: 15
seed: 0
