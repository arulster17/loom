# Exercises the hard budget abort. The planner prices count-bounded closed-loop
# runs as rounds of `concurrency` parallel requests, but this mock serves one
# sequence at a time (max_num_seqs: 1), so each run takes ~8x its estimate. The
# plan fits the $8 cap; at a simulated $3600/h ($1/s) recorded spend reaches the
# cap mid-run, the guard cancels the in-flight job, tears the host down and the
# experiment ends `aborted`.
name: mock-budget-abort
description: Mock serving one sequence at a time at $1/s, so the budget guard trips mid-run.
model: qwen3-8b
provider:
  kind: mock
  hourly_price: "$3600"
  time_scale: 0.25
  max_num_seqs: 1
  step_base_ms: 50
variants:
  - name: serial
workloads:
  - profile: fixed-128-128
    load:
      mode: closed_loop
      values: [8]
      num_requests: 16
repetitions: 2
budget:
  max_spend: "$8"
  ttl_minutes: 0.13
  accrual_interval_s: 0.25
