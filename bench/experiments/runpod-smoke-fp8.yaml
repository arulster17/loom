# RunPod smoke test for the FP8 path of llama-3.3-70b-fp8-tp4-runpod.yaml, at the
# smallest scale that runs it on real hardware: one Secure 1x L40S pod ($1.09/h). The 70B
# FP8 checkpoint needs 4 GPUs, so the smoke serves the same kind of checkpoint on one:
# RedHatAI's FP8-dynamic quantization of Qwen3-8B, made the same way (llm-compressor
# FP8_dynamic, lm_head in BF16, compressed-tensors `float-quantized`: FP8 weights with
# per-channel scales, FP8 activations with dynamic per-token scales). vLLM v0.30.0 serves
# both with the same scheme (CompressedTensorsW8A8Fp8, CUTLASS FP8 GEMMs on sm_89), so a
# checkpoint, kernel or image problem shows here for cents instead of after the 70B's
# 73 GB download on a $4.40/h pod.
#
# What it runs that no other smoke does (docs/runbook-runpod.md): a pre-quantized
# compressed-tensors checkpoint loaded with no --quantization flag; a warm restart onto a
# different checkpoint on the same image; the FP8 candidate's eval job scoring divergence
# on a BF16 reference (`score`, as the 70B FP8 cell does on cf4d1614's) and its gate
# against BF16. Same load shapes as the 70B FP8 run (its two profiles, geometric search
# with descent, 3 repetitions, the SLO) and the same quality subset, at 4 items per task.
#
# What it cannot run: TP=4 (the BF16 70B runs did), the Llama 3.3 FP8 tokenizer's leftover
# 2048-token truncation (fixed and tested offline: bench/tests/test_tokenize.py), and the
# stored-baseline gate, which is laptop-side code (no pod involved): tested end to end on
# the mock provider (bench/tests/runner/test_stored_baseline.py), and `bench plan` of the
# 70B spec loads and checks cf4d1614's real samples and reference before any spend.
# bench/tests/runner/test_plan.py fails if this smoke and the 70B FP8 spec drift apart.
name: runpod-smoke-fp8
description: The 70B FP8 run's FP8 path at smoke scale on one L40S (Qwen3-8B BF16 vs its FP8-dynamic checkpoint).
model: qwen3-8b
smoke: true
provider:
  kind: runpod
  container_disk_gb: 80
variants:
  # The BF16 registry checkpoint: the baseline, capturing the divergence reference.
  - name: vllm
  # RedHatAI/Qwen3-8B-FP8-dynamic: Apache-2.0 like the base model, not gated. Weights
  # uploaded 2025-05-02 (0276b68b); every later commit, up to this pin, only edits
  # README.md. 2 safetensors shards (9.4 GB), no .bin/.pt/pickle files.
  - name: vllm-fp8
    hf:
      repo: RedHatAI/Qwen3-8B-FP8-dynamic
      revision: 05233ce1e0565b5fdc9cfa000ab840152ed30c70
      license: apache-2.0
      gated: false
      size_bytes: 9438581960
      quant_method: compressed-tensors
    quantization: fp8
workloads:
  - profile: fixed-1k-1k
    overrides: {output_len: 128}
    load:
      mode: open_loop
      search: {lo: 0.5, hi: 1, rel_tol: 0.1, max_points: 2, scale: geometric, descend: 1}
      duration_s: 10
      warmup_s: 2
      drain_timeout_s: 15
  - profile: shared-prefix
    overrides: {output_len: 32}
    load:
      mode: open_loop
      search: {lo: 1, hi: 2, rel_tol: 0.1, max_points: 2, scale: geometric, descend: 1}
      duration_s: 10
      warmup_s: 2
      drain_timeout_s: 15
repetitions: 3
slo:
  ttft_ms: {p95: 1000}
  tpot_ms: {p95: 50}
  max_error_rate: 0.01
quality:
  suite: qwen3-8b
  subset: phase0-strict
  baseline_variant: vllm
  limit: 4
# One pod for both cells (same image). The TTL holds `bench plan`'s estimate with margin;
# max_spend holds the worst case of the pod living to its TTL.
budget:
  max_spend: "$1.25"
  ttl_minutes: 65
  accrual_interval_s: 15
seed: 0
