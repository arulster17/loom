# Qwen3-8B, vLLM vs SGLang on AWS (build prompt 7.8, D6: "first leaderboard for Model A,
# vLLM vs SGLang, one GPU type, AWS"), both engines on one g6e.xlarge on-demand host
# (1x L40S, 4 vCPU, 32 GiB; $1.861/h + 200 GB gp3), one after the other:
#
# - bf16: vLLM v0.30.0 BF16, exactly 95cde129's bf16 cell (qwen3-8b-aws-g6e: same
#   variant, so the same config hash 48f3d8d1...), measured again on this host;
# - sglang: SGLang v0.5.21 BF16 (RunPod 565b8d3f's image and launch), a warm restart onto
#   another image: the host pulls SGLang's image and its engine loads the checkpoint the
#   vLLM start downloaded, offline.
#
# Serving vLLM again on the same host and session (the user's choice, 2026-10-11, for
# about $3.30 more) removes host-to-host variation from the engine comparison. The stored
# 95cde129 cell stays the cross-check: same config hash, so `bench compare 95cde129 <this>
# --match-by cell_key --cell-a bf16 --cell-b bf16` shows how well an AWS run reproduces
# (RunPod 7a8237d0 vs AWS 95cde129 matched at all 10 points).
#
# Same as 95cde129: instance type, market, AMI (pin it: LOOM_AWS_AMI_ID), the chat profile,
# windows (255 s, 45 s warmup, 60 s drain), search (lo 4.5, step 1.5, descend 3, 5 points),
# seed, repetitions and SLO. If SGLang's knee is near vLLM's (RunPod 565b8d3f: tied on
# fixed-1k-1k and shared-prefix), its search visits vLLM's loads exactly (4.5, 3, 2,
# 2.449, 2.213 req/s) and every point is compared at equal load.
#
# Quality, as the RunPod engine comparison did it (565b8d3f, b1b904dc, b03b3c52): SGLang
# gated against vLLM BF16 in-run, which captures the divergence reference and its noise
# floor; phase0-strict, 3 replicated passes a side (as 95cde129).
#
# New on AWS (the smoke, aws-smoke-g6e-sglang.yaml, runs each first): the SGLang image
# (15.2 GB compressed, against vLLM's 8.7 GB) and its python3 for the offline weight
# check, a warm restart that switches engine image, SGLang's launch, health and metrics on
# the DLAMI's driver, chat-sharegpt on SGLang (never run on any provider; shared-prefix
# chat did run on RunPod), and tool_calling_strict on SGLang.
name: qwen3-8b-sglang-aws-g6e
description: Qwen3-8B BF16 on one AWS g6e.xlarge on-demand (1x L40S), vLLM v0.30.0 vs SGLang v0.5.21 on chat at SLO on the same host, SGLang gated vs vLLM on 3 passes; the vLLM vs SGLang board on AWS.
model: qwen3-8b
provider:
  kind: aws_ec2
  region: us-east-1
  instance_type: g6e.xlarge
  market: on_demand
  disk_gb: 200
variants:
  - name: bf16
  - name: sglang
    engine:
      name: sglang
      version: "0.5.21"
      image: lmsysorg/sglang@sha256:b1259f3ea3275f66237c498ea388919729018bc9f01c3d638391e06e2cf3f469
workloads:
  - profile: chat-sharegpt
    load:
      mode: open_loop
      search: {lo: 4.5, hi: 16, rel_tol: 0.05, max_points: 5, scale: geometric, step: 1.5, descend: 3}
      duration_s: 255
      warmup_s: 45
      drain_timeout_s: 60
repetitions: 3
slo:
  ttft_ms: {p95: 1000}
  tpot_ms: {p95: 50}
  max_error_rate: 0.01
quality:
  suite: qwen3-8b
  subset: phase0-strict
  baseline_variant: bf16
  replicates: 3
# The TTL holds `bench plan`'s estimate with margin; max_spend holds the worst case of the
# host living to its TTL.
budget:
  max_spend: "$9.75"
  ttl_minutes: 310
  accrual_interval_s: 15
seed: 0
