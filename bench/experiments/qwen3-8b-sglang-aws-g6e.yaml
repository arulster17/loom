# Qwen3-8B on SGLang on AWS (build prompt 7.8, D6: "first leaderboard for Model A, vLLM vs
# SGLang, one GPU type, AWS"). The vLLM side already ran on AWS: qwen3-8b-aws-g6e,
# 95cde129 (2026-10-10/11), whose bf16 cell is vLLM v0.30.0 BF16 on one g6e.xlarge
# on-demand. This adds SGLang v0.5.21 BF16 on the same instance type, market, AMI (pin
# it: LOOM_AWS_AMI_ID), chat profile, windows, search, repetitions and SLO, so
# `bench report -e 95cde129 -e <this>` puts both engines on one board, ranked at the SLO
# with latency at equal load.
#
# vLLM is not served again. Same-SKU host-to-host variation is below what this comparison
# can resolve: RunPod 7a8237d0 and AWS 95cde129 (other cloud, other host, other driver,
# 4 vCPU against 16) visited the same search points, found the same knees and were within
# normal variance at all 10 matched (cell, load) points (`bench compare` exit 0), and
# BF16 on RunPod 565b8d3f and 7a8237d0, two days apart, agreed at their shared point.
# Re-serving vLLM would double the host time (~1.75 h more, ~$3.30) to re-measure a
# number that already reproduced across clouds.
#
# Quality, as the RunPod engine comparison did it (565b8d3f, b1b904dc, b03b3c52: SGLang
# gated against vLLM BF16, which is the divergence reference): every SGLang pass is gated
# against 95cde129's stored vLLM BF16 evaluation (`quality.baseline`), the same suite and
# subset (phase0-strict) and 3 replicated passes a side, scored on its stored divergence
# reference and noise floor. That baseline ran on the same AMI (driver 595.91.07, CUDA
# 13.2) and SKU, where its passes repeated exactly (0 unstable items on gsm8k and ifeval).
#
# The search is 95cde129's: lo 4.5, step 1.5, descend 3, 5 points, 255 s windows with
# 45 s warmup and a 60 s drain. If SGLang's knee is near vLLM's (RunPod 565b8d3f: the
# engines tied on fixed-1k-1k and shared-prefix), it visits exactly vLLM's loads (4.5, 3,
# 2, 2.449, 2.213 req/s) and every point is compared at equal load.
#
# New on AWS (the smoke, aws-smoke-g6e-sglang.yaml, runs each first): the SGLang image
# (15.2 GB compressed, against vLLM's 8.7 GB) and its python3 for the weight download, its
# launch, health and metrics on the DLAMI's driver, chat-sharegpt on SGLang (never run on
# any provider; shared-prefix chat did run on RunPod), tool_calling_strict on SGLang, and a
# stored-baseline gate on a real host.
name: qwen3-8b-sglang-aws-g6e
description: Qwen3-8B BF16 on SGLang v0.5.21 on one AWS g6e.xlarge on-demand (1x L40S), chat at SLO, gated vs the stored vLLM BF16 of 95cde129 on 3 passes; the vLLM vs SGLang board on AWS.
model: qwen3-8b
provider:
  kind: aws_ec2
  region: us-east-1
  instance_type: g6e.xlarge
  market: on_demand
  disk_gb: 200
variants:
  - name: sglang
    engine:
      name: sglang
      version: "0.5.21"
      image: lmsysorg/sglang@sha256:b1259f3ea3275f66237c498ea388919729018bc9f01c3d638391e06e2cf3f469
workloads:
  - profile: chat-sharegpt
    load:
      mode: open_loop
      search: {lo: 4.5, hi: 16, rel_tol: 0.05, max_points: 5, scale: geometric, step: 1.5, descend: 3}
      duration_s: 255
      warmup_s: 45
      drain_timeout_s: 60
repetitions: 3
slo:
  ttft_ms: {p95: 1000}
  tpot_ms: {p95: 50}
  max_error_rate: 0.01
quality:
  suite: qwen3-8b
  subset: phase0-strict
  # 95cde129's bf16 cell: vLLM v0.30.0 BF16, g6e.xlarge on-demand (its eval runs, samples,
  # reference and noise floor are in the results DB and results/95cde129-.../evals/).
  baseline:
    experiment: 95cde129-e626-4eda-bad6-1421ed4d8a7b
    config_hash: 48f3d8d1850a0b1bfc6f454ee35a29902d4dc858ed984252defa8ffe5f621375
  replicates: 3
# The TTL holds `bench plan`'s estimate with margin; max_spend holds the worst case of the
# host living to its TTL.
budget:
  max_spend: "$5.50"
  ttl_minutes: 175
  accrual_interval_s: 15
seed: 0
