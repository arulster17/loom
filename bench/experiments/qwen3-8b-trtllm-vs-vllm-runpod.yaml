# PROPOSED 2026-11-02, NOT APPROVED, NOT RUN: run runpod-smoke-trtllm.yaml first.
#
# TensorRT-LLM against vLLM on Qwen3-8B, RunPod Secure 1x L40S, on the Lab's realistic
# chat workload (leading) and fixed-1k-1k, at the same SLO, windows and search shape as the
# config sweep (qwen3-8b-config-sweep-runpod, 7a8237d0), so every row compares with that
# sweep's bf16 row point for point. Explainer: docs/perf/tensorrt-llm.md.
#
# - vllm-bf16: vLLM v0.30.0 at the registry defaults, the reference row and the gate's
#   baseline (it captures the divergence reference). Its config hash is the sweep's bf16
#   cell (7a203a3f...; bench/tests/runner/test_trtllm_plan.py), so this is also a
#   same-config repeat of 7a8237d0's chat 2.213 / 1k-1k 1.0 req/s on a fresh pod, on the
#   same day as the candidates: pod-to-pod drift stays out of the engine comparison.
# - trtllm-bf16: TensorRT-LLM 1.4.0rc2, `trtllm-serve` on its PyTorch backend (no engine
#   build), at engine defaults plus what Loom always sets: xgrammar for response_format,
#   the Prometheus endpoint with iteration stats, the Qwen3 tool parser, the served name
#   and the 32768 context cap. No stable release after 1.2.1 exists (GitHub releases and
#   the NGC release repo's tags, checked 2026-11-02), and 1.2.1 rejects strict tools,
#   mis-reads the json_schema wrapper and exports no running/waiting/KV gauges; 1.4.0rc2
#   fixes all three, so it is pinned here and in the smoke.
#   Image nvcr.io/nvidia/tensorrt-llm/release:1.4.0rc2, multi-arch index digest below
#   (anonymous pull, no NGC key; CUDA 13.4, so it relies on minor-version compatibility
#   on the default CUDA 13.0 hosts: the smoke proves it or not).
# - trtllm-fp8: the same engine on NVIDIA's ModelOpt FP8 checkpoint with its calibrated
#   FP8 KV cache (registry row qwen3-8b-fp8-modelopt), on its own pod (host_group b):
#   both TRT-LLM cells on one pod would put it past 80% of its TTL.
#
# Engine defaults that differ, recorded not tuned (docs/perf/tensorrt-llm.md): TRT-LLM
# admits a request only when its whole KV budget is free (GUARANTEED_NO_EVICT; vLLM
# preempts instead), does not chunk prefills, caps a step at 8192 tokens (vLLM: 2048 on
# this GPU) and sizes its KV cache from 90% of the memory left after the weights.
#
# Quality: phase0-strict with three replicated passes per cell, as the sweep, so the
# vLLM cell pairs with 7a8237d0's evals too. Every candidate is gated against vllm-bf16
# on the full gate, divergence included: trtllm-serve has no prompt logprobs over HTTP,
# so the engine runs with Loom's prompt-logprobs route (loom_bench/trtllm_scorer.py),
# which answers the divergence check's echo+logprobs requests from the served LLM object
# itself (TRT-LLM's `prompt_logprobs`): same process, GPU, weights and precision.
#
# Budget (`bench plan`, prices.yaml $1.1010/h with disk, against a copy of the results
# DB): see max_spend below and docs/perf/tensorrt-llm.md for the quote.
name: qwen3-8b-trtllm-vs-vllm-runpod
description: Qwen3-8B on RunPod Secure 1x L40S, TensorRT-LLM 1.4.0rc2 BF16 and FP8 vs vLLM v0.30.0 BF16, chat and 1k/1k at SLO, gated vs vLLM BF16.
model: qwen3-8b
provider:
  kind: runpod
  container_disk_gb: 80
  # Hosts whose driver reports CUDA 13.0, 13.1 or 13.2. RunPod schedules only onto
  # machines whose CUDA version is in this list; with the default ["13.0"] every create
  # was refused for 2.5 h on 2026-11-02 (c1470fb9, 627c9916; the profiling and spec-decode
  # smokes too) while L40S Secure stock was listed for a minimum CUDA of 13.0 up to 13.2
  # and none from 13.3. Both images run on any of these drivers (vLLM's CUDA 13.0 userspace
  # directly, TRT-LLM's 13.4 through minor-version compatibility, driver >= 580). The list
  # is part of the config hash, so the vllm-bf16 cell no longer shares 7a8237d0's hash: the
  # same engine, image, model and args, on a wider set of host drivers.
  allowed_cuda_versions: ["13.0", "13.1", "13.2"]
variants:
  - name: vllm-bf16
  - name: trtllm-bf16
    engine:
      name: trtllm
      version: "1.4.0rc2"
      image: nvcr.io/nvidia/tensorrt-llm/release@sha256:93a3eaf1fa574813d608a7147735134bcfbd06d18d1aa98e8ee0d5da09e51e3a
  - name: trtllm-fp8
    model: qwen3-8b-fp8-modelopt
    host_group: b
workloads:
  # Searches start just above vLLM BF16's measured knees (chat 2.213, failing at 2.449;
  # 1k-1k 1.0, failing at 1.107) and step by 1.5x, so vLLM brackets its knee in a step or
  # two and TRT-LLM climbs or descends from the same place.
  - profile: chat-sharegpt
    load:
      mode: open_loop
      search: {lo: 2.25, hi: 16, rel_tol: 0.05, max_points: 5, scale: geometric, step: 1.5, descend: 3}
      duration_s: 255
      warmup_s: 45
      drain_timeout_s: 60
  - profile: fixed-1k-1k
    load:
      mode: open_loop
      search: {lo: 1.0, hi: 6, rel_tol: 0.05, max_points: 4, scale: geometric, step: 1.5, descend: 2}
      duration_s: 240
      warmup_s: 60
      drain_timeout_s: 60
repetitions: 3
slo:
  ttft_ms: {p95: 1000}
  tpot_ms: {p95: 50}
  max_error_rate: 0.01
quality:
  suite: qwen3-8b
  subset: phase0-strict
  baseline_variant: vllm-bf16
  replicates: 3
budget:
  max_spend: "$16"
  ttl_minutes: 285
  accrual_interval_s: 15
seed: 0
