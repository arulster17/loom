# PROPOSED 2026-11-03, NOT APPROVED, NOT RUN: the part of aws-smoke-trtllm that did not run.
#
# aws-smoke-trtllm (d549221f, 2026-11-03, $1.86) ran its vllm-bf16 and trtllm-bf16 hosts in
# full and every check passed on them (docs/perf/tensorrt-llm.md). It failed provisioning
# its third host, trtllm-fp8, with VcpuLimitExceeded 0.3 s after the second host was
# terminated (AWS's quota accounting trails `terminated`; the provider now waits that out,
# aws_ec2.QUOTA_WAIT_S). The runner has no resume and no cell filter, so this spec runs
# exactly that missing cell: the same variant (registry row qwen3-8b-fp8-modelopt, so the
# same config hash as d549221f's trtllm-fp8 cell would have had), the same provider block,
# workloads, search shape, repetitions, SLO, quality subset, replicates and item limit.
#
# Its gate is against d549221f's stored vllm-bf16 evals and divergence reference
# (config hash 48f3d8d1...): a smoke's evals at limit 4 pair only with a smoke's at the
# same limit, as runpod-smoke-h200 pairs with 8bc65cfa's. So its new paths are exactly
# trtllm-fp8's: the ModelOpt FP8 checkpoint downloaded and loaded by TensorRT-LLM 1.4.0rc2
# with its FP8 KV cache on the L40S (sm_89; TRT-LLM's docs mark per-tensor FP8 supported on
# Ada but also say its FP8 targets Hopper and Blackwell), load jobs and metrics on it, every
# eval task, and divergence scored through the prompt-logprobs route on the stored
# reference. Planning it needs the results DB that holds d549221f.
#
# Budget: one host; `bench plan` against a copy of the results DB (see max_spend).
name: aws-smoke-trtllm-fp8
description: aws-smoke-trtllm's missing trtllm-fp8 cell, gated against its stored vLLM BF16 smoke evals.
model: qwen3-8b
smoke: true
provider:
  kind: aws_ec2
  region: us-east-1
  instance_type: g6e.xlarge
  market: on_demand
  disk_gb: 200
variants:
  - name: trtllm-fp8
    model: qwen3-8b-fp8-modelopt
    host_group: b
workloads:
  - profile: chat-sharegpt
    overrides: {max_output_len: 64}
    load:
      mode: open_loop
      search: {lo: 1, hi: 1.5, rel_tol: 0.05, max_points: 2, scale: geometric, step: 1.5, descend: 1}
      duration_s: 10
      warmup_s: 2
      drain_timeout_s: 15
  - profile: fixed-1k-1k
    overrides: {output_len: 128}
    load:
      mode: open_loop
      search: {lo: 0.5, hi: 0.75, rel_tol: 0.05, max_points: 2, scale: geometric, step: 1.5, descend: 1}
      duration_s: 10
      warmup_s: 2
      drain_timeout_s: 15
repetitions: 3
slo:
  ttft_ms: {p95: 1000}
  tpot_ms: {p95: 50}
  max_error_rate: 0.01
quality:
  suite: qwen3-8b
  subset: phase0-strict
  replicates: 3
  limit: 4
  # aws-smoke-trtllm (d549221f)'s vllm-bf16 cell: stored smoke evals at limit 4.
  baseline:
    experiment: d549221f-285e-4820-8d51-a391e46ced4f
    config_hash: "48f3d8d1850a0b1bfc6f454ee35a29902d4dc858ed984252defa8ffe5f621375"
budget:
  max_spend: "$2.25"
  ttl_minutes: 65
  accrual_interval_s: 15
seed: 0
