# Follow-up to the Qwen3-8B config sweep (qwen3-8b-config-sweep-runpod, approved
# 2026-10-09 with this follow-up): the sweep's winning config, re-measured on the two
# cheaper Ada 48 GB cards, to see whether either serves Qwen3-8B for less per token than
# the L40S. RunPod Secure 1x, API 2026-10-09: L40S $1.09/h, RTX 6000 Ada $0.99 (960 GB/s,
# 11% more bandwidth), L40 $0.82 (864 GB/s, half the L40S's tensor throughput, so chat
# prefill may cost TTFT). Same vLLM image and sm_89 FP8 kernels as the sweep.
#
# Filled in from the sweep (7a8237d0, 2026-10-10), NOT RUN: it needs the user's go.
# 1. The config is fp8-kv8 (FP8-dynamic weights by `model: qwen3-8b-fp8`,
#    `kv_cache_dtype: fp8`, default engine args): the cheapest at the SLO on chat
#    ($0.0467 [0.0418, 0.0522] per 1M blended, 5.239 req/s) and tied cheapest on 1k/1k.
#    No candidate passed its gate in the sweep: fp8-kv8's was INCONCLUSIVE on gsm8k
#    alone (-0.28 pts [-1.14, +0.61], margin 1.00), every other task non-inferior. So
#    this is the leading candidate, not a shipped winner, and these cards ship it only
#    on their own gate pass against the stored L40S BF16 baseline below.
# 2. `quality.baseline`: the sweep's experiment id and its bf16 cell's config hash, so
#    both cells are gated against the stored L40S BF16 evals and scored on its
#    divergence reference. A new GPU is a new config (the hardware is in the config
#    hash), so it ships only on its own gate pass (docs/PLAN.md, quality standard).
# 3. chat-sharegpt `search.lo`: fp8-kv8's chat goodput on the L40S (5.239 req/s, failing
#    at 5.511). Both cards have about the L40S's bandwidth, so their knees should sit
#    near it; four points at step 1.5 with a two-step descent bracket it.
#
# Only chat-sharegpt, the workload the price is set from (docs/how-to/price-a-model.md),
# with the sweep's windows (210 s measured after 45 s of warmup), so the per-token cost
# compares with the sweep's L40S row point for point. fixed-1k-1k is left out to stay
# near the ~$3 approved; add it back from the sweep spec if the chat result is close.
#
# Each card is its own pod (the instance type is in the host key), run one after the
# other, each with its own cold start, dataset fetch and three phase0-strict passes.
name: qwen3-8b-winner-ada-runpod
description: The Qwen3-8B sweep's winning config on RunPod Secure 1x L40 and 1x RTX 6000 Ada, chat at SLO, gated vs the sweep's stored BF16.
model: qwen3-8b
provider:
  kind: runpod
  container_disk_gb: 80
variants:
  - name: winner-l40
    hardware: {gpu: L40, instance_types: {runpod: l40-x1}}
    # winner
    model: qwen3-8b-fp8
    kv_cache_dtype: fp8
  - name: winner-rtx6000ada
    hardware: {gpu: RTX 6000 Ada, instance_types: {runpod: rtx6000ada-x1}}
    # winner
    model: qwen3-8b-fp8
    kv_cache_dtype: fp8
workloads:
  - profile: chat-sharegpt
    load:
      mode: open_loop
      search: {lo: 5.239, hi: 16, rel_tol: 0.05, max_points: 4, scale: geometric, step: 1.5, descend: 2}
      duration_s: 255
      warmup_s: 45
      drain_timeout_s: 60
repetitions: 3
slo:
  ttft_ms: {p95: 1000}
  tpot_ms: {p95: 50}
  max_error_rate: 0.01
quality:
  suite: qwen3-8b
  subset: phase0-strict
  replicates: 3
  # The sweep's bf16 cell (7a8237d0), stored evals and divergence reference.
  baseline:
    experiment: 7a8237d0-9917-47e7-b93e-8cb0230e0059
    config_hash: "7a203a3ffaccb1820fd23e6da9fab1d00c4cb51c427ce1572c56b08a8036107a"
budget:
  max_spend: "$5"
  ttl_minutes: 150
  accrual_interval_s: 15
seed: 0
