# Phase 0 leaderboard #1: Qwen3-8B (BF16) on one L40S, vLLM vs SGLang at engine
# defaults (prefix caching on in both). One g6e.xlarge spot host serves both
# engines: SGLang starts warm after vLLM, reusing the downloaded weights.
#
# Each workload searches the open-loop rate for the highest load meeting the SLO,
# geometrically: it climbs x2 from `lo` until a rate fails, then bisects on a log
# scale, so few points land in overload (the slowest points to run). The ranges fit
# one L40S: the first RunPod sweep (058128e9, vLLM) passed fixed-1k-1k at 1.22 and
# failed at 1.94 req/s, and passed shared-prefix and code-completion at 1 but failed
# them at 4.88 and 6.88. Starting those two at 1.5 lets 5 points bracket a knee near
# 4-6 req/s to ~20%.
# 3 repetitions per point. Image digests: research notes of 2026-10-04.
#
# AWS path (secondary): the account's GPU spot quota is 0, so the real run is
# on RunPod Secure Cloud (1x L40S): qwen3-8b-vllm-vs-sglang-runpod.yaml.
name: qwen3-8b-vllm-vs-sglang
description: Qwen3-8B BF16 on g6e.xlarge spot, vLLM v0.30.0 vs SGLang v0.5.21, rate sweeps at SLO.
model: qwen3-8b
provider:
  kind: aws_ec2
  region: us-east-1
  instance_type: g6e.xlarge
  market: spot
  disk_gb: 200
variants:
  - name: vllm
    engine:
      name: vllm
      version: "0.30.0"
      image: vllm/vllm-openai@sha256:8a69ffad015f138d7170c4ddc429e230a3bc1c1719f67e14324749df200a4b90
  - name: sglang
    engine:
      name: sglang
      version: "0.5.21"
      image: lmsysorg/sglang@sha256:b1259f3ea3275f66237c498ea388919729018bc9f01c3d638391e06e2cf3f469
workloads:
  - profile: fixed-1k-1k
    load:
      mode: open_loop
      search: {lo: 0.5, hi: 4, rel_tol: 0.1, max_points: 6, scale: geometric}
      duration_s: 180
      warmup_s: 30
      drain_timeout_s: 60
  - profile: shared-prefix
    load:
      mode: open_loop
      search: {lo: 1.5, hi: 8, rel_tol: 0.1, max_points: 5, scale: geometric}
      duration_s: 120
      warmup_s: 20
      drain_timeout_s: 30
  - profile: code-completion
    load:
      mode: open_loop
      search: {lo: 1.5, hi: 8, rel_tol: 0.1, max_points: 5, scale: geometric}
      duration_s: 120
      warmup_s: 20
      drain_timeout_s: 30
repetitions: 3
slo:
  ttft_ms: {p95: 1000}
  tpot_ms: {p95: 50}
  max_error_rate: 0.01
# Quality (docs/quality-gate.md): switching engine can change outputs, so SGLang is gated
# against vLLM BF16, which also serves as the BF16 divergence reference. Both run the suite's
# Phase 0 subset as an eval job on the host after their load runs; vLLM captures the
# reference logprobs and SGLang is scored against them when its engine is up.
quality:
  suite: qwen3-8b
  subset: phase0
  baseline_variant: vllm
budget:
  max_spend: "$40"
  ttl_minutes: 480
  accrual_interval_s: 15
seed: 0
