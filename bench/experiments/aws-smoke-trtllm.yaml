# PROPOSED 2026-11-02, NOT APPROVED, NOT RUN: run before qwen3-8b-trtllm-vs-vllm-aws.yaml.
# The AWS twin of runpod-smoke-trtllm.yaml (its list of what only a smoke can prove, and
# what to check after it, applies): the TensorRT-LLM vs vLLM run at smoke scale.
#
# Why AWS: RunPod Secure 1x L40S was out of stock all of 2026-11-02 (191 refused creates,
# supply, not the request). The account's AWS us-east-1 on-demand G/VT quota (4 vCPU;
# spot 0) fits exactly one g6e.xlarge: the same L40S 48 GB, with 4 vCPU and 32 GiB of RAM
# (the pod had 16 vCPU and 94 GiB), at $1.861/h plus 200 GB gp3. Pinned to g6e.xlarge, no
# fallback. Only the provider block, the budget and what the host forces differ from the
# RunPod original, which keeps the design notes; config hashes differ (the hardware is in
# them). bench/tests/aws/test_aws_perf_track.py fails if this, its twin or their RunPod
# originals drift apart.
#
# Three hosts, one after the other, as RunPod's three pods: AWS keys a host by instance
# type, not image, so trtllm-bf16 gets its own host_group (a third of the run would put
# a shared host past its TTL), and teardown waits until each instance is `terminated`
# before the next launches (the quota holds one).
#
# New on AWS: TensorRT-LLM never ran on the aws_ec2 path. The 17.3 GB image pulled onto the
# root volume (~8 min at the 37 MB/s EC2 hosts pulled SGLang), its python3 checking and
# downloading weights, the launcher and prompt-logprobs wrapper as `bash -c` argv of
# `docker run` (with NVIDIA's `--ulimit memlock=-1 --ulimit stack=67108864`, `--ipc
# host`), its CUDA 13.4 userspace on the DLAMI's driver 595.91.07 (CUDA 13.2, minor-version
# compatibility), model load and evals on 32 GiB of host RAM, /prometheus/metrics with
# iteration stats. If an engine start fails with FlashInfer's "requires .target sm_90",
# add `engine_env: {TRTLLM_ENABLE_PDL: "0"}` to both specs' provider blocks.
#
# Each host's TTL holds `bench plan`'s estimate with margin (2026-11-02: hosts 44.4, 50.3
# and 49.2 min of 65); estimate $4.52; max_spend holds the worst case of all three hosts
# living to their TTL, $6.12; cap $6.25.
name: aws-smoke-trtllm
description: The Qwen3-8B TensorRT-LLM vs vLLM RunPod run at smoke scale, every code path once.
model: qwen3-8b
smoke: true
provider:
  kind: aws_ec2
  region: us-east-1
  instance_type: g6e.xlarge
  market: on_demand
  disk_gb: 200
variants:
  - name: vllm-bf16
  - name: trtllm-bf16
    engine:
      name: trtllm
      version: "1.4.0rc2"
      image: nvcr.io/nvidia/tensorrt-llm/release@sha256:93a3eaf1fa574813d608a7147735134bcfbd06d18d1aa98e8ee0d5da09e51e3a
    host_group: trtllm-bf16
  - name: trtllm-fp8
    model: qwen3-8b-fp8-modelopt
    host_group: b
workloads:
  - profile: chat-sharegpt
    overrides: {max_output_len: 64}
    load:
      mode: open_loop
      search: {lo: 1, hi: 1.5, rel_tol: 0.05, max_points: 2, scale: geometric, step: 1.5, descend: 1}
      duration_s: 10
      warmup_s: 2
      drain_timeout_s: 15
  - profile: fixed-1k-1k
    overrides: {output_len: 128}
    load:
      mode: open_loop
      search: {lo: 0.5, hi: 0.75, rel_tol: 0.05, max_points: 2, scale: geometric, step: 1.5, descend: 1}
      duration_s: 10
      warmup_s: 2
      drain_timeout_s: 15
repetitions: 3
slo:
  ttft_ms: {p95: 1000}
  tpot_ms: {p95: 50}
  max_error_rate: 0.01
quality:
  suite: qwen3-8b
  subset: phase0-strict
  baseline_variant: vllm-bf16
  replicates: 3
  limit: 4
budget:
  max_spend: "$6.25"
  ttl_minutes: 65
  accrual_interval_s: 15
seed: 0
