# Loom model registry: the single source of truth for every model Loom serves.
# The Benchmark Lab reads models from here (the gateway and billing will too), so
# adding or changing a model is a config change, validated by loom_bench.registry.
#
# Prices stay null until the Benchmark Lab measures cost at SLO; only `enabled`
# models must carry a price.

models:
  - id: qwen3-8b
    display_name: Qwen3 8B
    hf:
      repo: Qwen/Qwen3-8B
      revision: b968826d9c46dd6066d109eabc6255188de91218
      license: apache-2.0
      gated: false
      size_bytes: 16381516776
      quant_method: null  # unquantized BF16 checkpoint
      trust_remote_code: false
    engine:
      # vLLM is the default engine; SGLang is compared against it in the Lab.
      name: vllm
      version: "0.30.0"
      # vllm/vllm-openai:v0.30.0 multi-arch index digest (CUDA 13.0, needs driver >= 580).
      image: vllm/vllm-openai@sha256:8a69ffad015f138d7170c4ddc429e230a3bc1c1719f67e14324749df200a4b90
      args: {}
      # Benchmarks and evals pin non-thinking mode so output lengths are comparable
      # across engines and runs.
      chat_template_kwargs: {enable_thinking: false}
    hardware:
      gpu: L40S
      gpus_per_replica: 1
      nodes_per_replica: 1
      instance_types: {aws: g6e.xlarge, runpod: l40s-x1}
    parallelism: {tp: 1, pp: 1, ep: 1}
    # Native context. config.json says 40960, but the model card gives 32768 native and
    # 131072 only with YaRN rope scaling, which is not enabled here.
    max_context: 32768
    quantization: none
    kv_cache_dtype: auto
    pricing: null
    scaling: {min_replicas: 0, max_replicas: 1}
    clouds: [aws, runpod]
    capabilities: {tools: true, json_schema: true, vision: false, reasoning: true}
    # Qwen3 emits Hermes-style <tool_call> blocks: vLLM 0.30.0 `hermes`, SGLang 0.5.21
    # `qwen25` (its Qwen 2.5/3 detector).
    tool_call_parsers: {vllm: hermes, sglang: qwen25}
    routing_tier: 1
    status: preview

  - id: llama-3.3-70b-instruct
    display_name: Llama 3.3 70B Instruct
    hf:
      repo: meta-llama/Llama-3.3-70B-Instruct
      revision: 6f6073b423013f6a7d4d9f39144961bfbfbc386b
      license: llama3.3
      gated: manual
      size_bytes: 141107497872
      quant_method: null  # unquantized BF16 checkpoint
      trust_remote_code: false
    engine:
      name: vllm
      version: "0.30.0"
      # vllm/vllm-openai:v0.30.0 multi-arch index digest (CUDA 13.0, needs driver >= 580).
      image: vllm/vllm-openai@sha256:8a69ffad015f138d7170c4ddc429e230a3bc1c1719f67e14324749df200a4b90
      args: {}
      chat_template_kwargs: {}
    hardware:
      gpu: L40S
      gpus_per_replica: 4
      nodes_per_replica: 1
      instance_types: {aws: g6e.12xlarge, runpod: l40s-x4}
    parallelism: {tp: 4, pp: 1, ep: 1}
    # The model supports 131072. After ~141 GB of BF16 weights, 4 x 48 GB leaves too
    # little KV-cache memory for useful concurrency at that length, so serving is capped.
    max_context: 32768
    quantization: none
    kv_cache_dtype: auto
    pricing: null
    scaling: {min_replicas: 0, max_replicas: 1}
    clouds: [aws, runpod]
    capabilities: {tools: true, json_schema: true, vision: false, reasoning: false}
    # Llama 3.x JSON tool calls: vLLM 0.30.0 `llama3_json`, SGLang 0.5.21 `llama3`.
    tool_call_parsers: {vllm: llama3_json, sglang: llama3}
    routing_tier: 1
    status: preview

  # The 70B served in FP8 on the same 4x L40S: its own labeled row, gated against the
  # BF16 entry above, which stays the reference and headline row (docs/PLAN.md, quality
  # standard). Everything but the checkpoint and its precision matches the BF16 entry, so
  # the gate measures the precision alone.
  - id: llama-3.3-70b-instruct-fp8
    display_name: Llama 3.3 70B FP8
    hf:
      # Red Hat (Neural Magic) quantized meta-llama/Llama-3.3-70B-Instruct with
      # llm-compressor (`QuantizationModifier`, scheme FP8_dynamic, lm_head left in BF16):
      # FP8 weights with static per-channel scales, FP8 activations with dynamic per-token
      # scales, saved as compressed-tensors (`float-quantized`). The card names the base
      # repo, not its commit. Weights uploaded 2024-12-11 (9069d043); every later commit,
      # up to this pin, only edits README.md. 15 safetensors shards, no .bin/.pt/pickle.
      # tokenizer_config.json (chat template) is byte-identical to the BF16 pin's;
      # tokenizer.json differs only by a leftover `truncation: {max_length: 2048}`, which
      # transformers (vLLM) drops and loom_bench.tokenize disables.
      repo: RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic
      revision: f50dbad2c84590ca17dc51e207c34321b65ff14b
      license: llama3.3
      gated: false
      size_bytes: 72669954704
      quant_method: compressed-tensors  # config.json quantization_config.quant_method
      trust_remote_code: false
    engine:
      name: vllm
      version: "0.30.0"
      # vllm/vllm-openai:v0.30.0 multi-arch index digest (CUDA 13.0, needs driver >= 580).
      # Its CompressedTensorsW8A8Fp8 scheme needs compute capability 8.9: the L40S (Ada,
      # sm_89) runs FP8 GEMMs natively. No --quantization flag: vLLM reads the method from
      # config.json (registry pair table: compressed-tensors + fp8).
      image: vllm/vllm-openai@sha256:8a69ffad015f138d7170c4ddc429e230a3bc1c1719f67e14324749df200a4b90
      args: {}
      chat_template_kwargs: {}
    hardware:
      gpu: L40S
      gpus_per_replica: 4
      nodes_per_replica: 1
      instance_types: {aws: g6e.12xlarge, runpod: l40s-x4}
    parallelism: {tp: 4, pp: 1, ep: 1}
    # Same cap as BF16 so both rows serve the same window. FP8 weights (~73 GB) leave far
    # more KV-cache room on 4 x 48 GB; raising the cap is a separate change.
    max_context: 32768
    quantization: fp8
    kv_cache_dtype: auto
    pricing: null
    scaling: {min_replicas: 0, max_replicas: 1}
    clouds: [aws, runpod]
    capabilities: {tools: true, json_schema: true, vision: false, reasoning: false}
    tool_call_parsers: {vllm: llama3_json, sglang: llama3}
    routing_tier: 1
    status: preview
