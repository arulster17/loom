# Loom model registry: the single source of truth for every model Loom serves.
# The Benchmark Lab reads models from here (the gateway and billing will too), so
# adding or changing a model is a config change, validated by loom_bench.registry.
#
# A row's price comes from its measured cost at the SLO (docs/how-to/price-a-model.md);
# only `enabled` models must carry a price. Prices set 2026-10-11 (user decision): cost-plus
# 20% per side on the 95% CI high bound of the measured RunPod cost at SLO, assuming 100%
# utilization, each side rounded up to the next $0.001 per 1M (1,000 micros), so the
# markup is never under 20%. Cached input is not discounted (no workload isolates its cost
# yet). Only shipped winners are priced: the BF16 70B reference row and the unshipped
# Qwen3 8B FP8 row stay null. A cell's config hash treats the price as null, so pricing a
# row never moves it (loom_bench.experiment.build_cell).

models:
  - id: qwen3-8b
    display_name: Qwen3 8B
    hf:
      repo: Qwen/Qwen3-8B
      revision: b968826d9c46dd6066d109eabc6255188de91218
      license: apache-2.0
      gated: false
      size_bytes: 16381516776
      quant_method: null  # unquantized BF16 checkpoint
      trust_remote_code: false
    engine:
      # vLLM is the default engine; SGLang is compared against it in the Lab.
      name: vllm
      version: "0.30.0"
      # vllm/vllm-openai:v0.30.0 multi-arch index digest (CUDA 13.0, needs driver >= 580).
      image: vllm/vllm-openai@sha256:8a69ffad015f138d7170c4ddc429e230a3bc1c1719f67e14324749df200a4b90
      args: {}
      # Benchmarks and evals pin non-thinking mode so output lengths are comparable
      # across engines and runs.
      chat_template_kwargs: {enable_thinking: false}
    hardware:
      gpu: L40S
      gpus_per_replica: 1
      nodes_per_replica: 1
      instance_types: {aws: g6e.xlarge, runpod: l40s-x1}
    parallelism: {tp: 1, pp: 1, ep: 1}
    # Native context. config.json says 40960, but the model card gives 32768 native and
    # 131072 only with YaRN rope scaling, which is not enabled here.
    max_context: 32768
    quantization: none
    kv_cache_dtype: auto
    # 7a8237d0 (reports/8b-config-sweep-v1), bf16 on chat-sharegpt (the realistic workload),
    # RunPod Secure 1x L40S: cost per 1M input $0.0557 [0.0486, 0.0638], output $0.2517
    # [0.2049, 0.3060]. 63,798 x 1.2 = 76,557.6 -> 77,000; 305,960 x 1.2 = 367,152 -> 368,000.
    pricing: {input_per_mtok: 77_000, output_per_mtok: 368_000, cached_input_per_mtok: 77_000}
    scaling: {min_replicas: 0, max_replicas: 1}
    clouds: [aws, runpod]
    capabilities: {tools: true, json_schema: true, vision: false, reasoning: true}
    # Qwen3 emits Hermes-style <tool_call> blocks: vLLM 0.30.0 `hermes`, SGLang 0.5.21
    # `qwen25` (its Qwen 2.5/3 detector).
    tool_call_parsers: {vllm: hermes, sglang: qwen25}
    routing_tier: 1
    status: preview

  - id: llama-3.3-70b-instruct
    display_name: Llama 3.3 70B Instruct
    hf:
      repo: meta-llama/Llama-3.3-70B-Instruct
      revision: 6f6073b423013f6a7d4d9f39144961bfbfbc386b
      license: llama3.3
      gated: manual
      size_bytes: 141107497872
      quant_method: null  # unquantized BF16 checkpoint
      trust_remote_code: false
    engine:
      name: vllm
      version: "0.30.0"
      # vllm/vllm-openai:v0.30.0 multi-arch index digest (CUDA 13.0, needs driver >= 580).
      image: vllm/vllm-openai@sha256:8a69ffad015f138d7170c4ddc429e230a3bc1c1719f67e14324749df200a4b90
      # At TP=2 each GPU holds ~65.7 GiB of BF16 weights; at vLLM's default 0.90 of
      # 79.6 GiB the KV cache would not hold one 32768-token request, so vLLM would refuse
      # to start. 0.95 leaves an estimated ~45-50k tokens of KV cache, as run in 9f0853d7.
      args: {gpu_memory_utilization: 0.95}
      chat_template_kwargs: {}
    # As measured in 9f0853d7 / 9e5f7866 (reports/70b-h100-v2): one RunPod Secure 2x H100
    # SXM pod ("NVIDIA H100 80GB HBM3"), TP=2 over NVLink. BF16 met the SLO there at
    # 0.5 req/s on fixed-1k-1k; on 4x L40S at TP=4 (cf4d1614, 55102ddb) no load did. The
    # pod's NCCL setting (NCCL_P2P_LEVEL=NVL, P2P over NVLink only) is provider-level:
    # every multi-GPU RunPod spec sets one in provider.engine_env. AWS sells H100 only as
    # 1x (p5.4xlarge) or 8x (p5.48xlarge), so this row is RunPod-only.
    hardware:
      gpu: H100
      gpus_per_replica: 2
      nodes_per_replica: 1
      instance_types: {runpod: h100-sxm-x2}
    parallelism: {tp: 2, pp: 1, ep: 1}
    # The model supports 131072. After ~141 GB of BF16 weights, 2 x 80 GB leaves too
    # little KV-cache memory for useful concurrency at that length, so serving is capped.
    max_context: 32768
    quantization: none
    kv_cache_dtype: auto
    # Unpriced: the reference row, not the shipped winner (FP8 below). Its 9f0853d7
    # figure is also untrusted (TTFT p95 CV 21.8%).
    pricing: null
    scaling: {min_replicas: 0, max_replicas: 1}
    clouds: [runpod]
    capabilities: {tools: true, json_schema: true, vision: false, reasoning: false}
    # Llama 3.x JSON tool calls: vLLM 0.30.0 `llama3_json`, SGLang 0.5.21 `llama3`.
    tool_call_parsers: {vllm: llama3_json, sglang: llama3}
    routing_tier: 1
    status: preview

  # The 70B served in FP8 on the same 2x H100 SXM pod: its own labeled row, gated against
  # the BF16 entry above, which stays the reference and headline row (docs/PLAN.md,
  # quality standard). Everything but the checkpoint and its precision matches the BF16
  # entry, so the gate measures the precision alone. The measured winner: gate PASS on
  # every phase0-strict task (9e5f7866), 2 req/s on fixed-1k-1k and 4 req/s on
  # shared-prefix at the SLO (9f0853d7, trusted), 4x BF16's goodput on the same pod.
  - id: llama-3.3-70b-instruct-fp8
    display_name: Llama 3.3 70B FP8
    hf:
      # Red Hat (Neural Magic) quantized meta-llama/Llama-3.3-70B-Instruct with
      # llm-compressor (`QuantizationModifier`, scheme FP8_dynamic, lm_head left in BF16):
      # FP8 weights with static per-channel scales, FP8 activations with dynamic per-token
      # scales, saved as compressed-tensors (`float-quantized`). The card names the base
      # repo, not its commit. Weights uploaded 2024-12-11 (9069d043); every later commit,
      # up to this pin, only edits README.md. 15 safetensors shards, no .bin/.pt/pickle.
      # tokenizer_config.json (chat template) is byte-identical to the BF16 pin's;
      # tokenizer.json differs only by a leftover `truncation: {max_length: 2048}`, which
      # transformers (vLLM) drops and loom_bench.tokenize disables.
      repo: RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic
      revision: f50dbad2c84590ca17dc51e207c34321b65ff14b
      license: llama3.3
      gated: false
      size_bytes: 72669954704
      quant_method: compressed-tensors  # config.json quantization_config.quant_method
      trust_remote_code: false
    engine:
      name: vllm
      version: "0.30.0"
      # vllm/vllm-openai:v0.30.0 multi-arch index digest (CUDA 13.0, needs driver >= 580).
      # Its CompressedTensorsW8A8Fp8 scheme needs compute capability 8.9: the H100 (sm_90)
      # runs CUTLASS FP8 GEMMs natively. No --quantization flag: vLLM reads the method from
      # config.json (registry pair table: compressed-tensors + fp8).
      image: vllm/vllm-openai@sha256:8a69ffad015f138d7170c4ddc429e230a3bc1c1719f67e14324749df200a4b90
      # As BF16, so the gate measured precision alone: ~34 GiB of FP8 weights per GPU
      # leave ~38 GiB of KV cache per GPU.
      args: {gpu_memory_utilization: 0.95}
      chat_template_kwargs: {}
    hardware:
      gpu: H100
      gpus_per_replica: 2
      nodes_per_replica: 1
      instance_types: {runpod: h100-sxm-x2}
    parallelism: {tp: 2, pp: 1, ep: 1}
    # Same cap as BF16 so both rows serve the same window. FP8 weights (~73 GB) leave far
    # more KV-cache room on 2 x 80 GB; raising the cap is a separate change.
    max_context: 32768
    quantization: fp8
    kv_cache_dtype: auto
    # 9f0853d7 + 9e5f7866 (reports/70b-h100-v2), fixed-1k-1k: cost per 1M input $0.4548
    # [0.4350, 0.4755], output $0.6381 [0.6133, 0.6636]. No chat workload ran on the 70B,
    # and shared-prefix's split is unresolved (output CI [0, 0.895]).
    # 475,489 x 1.2 = 570,586.8 -> 571,000; 663,624 x 1.2 = 796,348.8 -> 797,000.
    pricing: {input_per_mtok: 571_000, output_per_mtok: 797_000, cached_input_per_mtok: 571_000}
    scaling: {min_replicas: 0, max_replicas: 1}
    clouds: [runpod]
    capabilities: {tools: true, json_schema: true, vision: false, reasoning: false}
    tool_call_parsers: {vllm: llama3_json, sglang: llama3}
    routing_tier: 1
    status: preview
    # Quantization of the entry above: compared with its public list prices
    # (competitors price Llama 3.3 70B per model; DeepInfra's listing is itself fp8).
    base_model: llama-3.3-70b-instruct

  # Qwen3-8B served in FP8: its own labeled row, gated against the BF16 entry
  # (qwen3-8b), which stays the reference and headline row. The smokes serve it as the
  # 70B runs serve llama-3.3-70b-instruct-fp8 (a variant naming another registry entry,
  # `Variant.model`), so that path runs on a GPU before the 70B does. Everything but the
  # checkpoint and its precision matches the BF16 entry, so the gate measures the
  # precision alone.
  - id: qwen3-8b-fp8
    display_name: Qwen3 8B FP8
    hf:
      # Red Hat (Neural Magic) quantized Qwen/Qwen3-8B with llm-compressor
      # (`QuantizationModifier`, scheme FP8_dynamic, lm_head left in BF16), made like the
      # 70B FP8 checkpoint: FP8 weights with per-channel scales, FP8 activations with
      # dynamic per-token scales, saved as compressed-tensors (`float-quantized`). Weights
      # uploaded 2025-05-02 (0276b68b); every later commit, up to this pin, only edits
      # README.md. 2 safetensors shards, no .bin/.pt/pickle. tokenizer.json matches the
      # BF16 pin's (no saved truncation or padding); tokenizer_config.json carries an
      # earlier Qwen3 chat template that renders string message content the same way.
      repo: RedHatAI/Qwen3-8B-FP8-dynamic
      revision: 05233ce1e0565b5fdc9cfa000ab840152ed30c70
      license: apache-2.0
      gated: false
      size_bytes: 9438581960
      quant_method: compressed-tensors  # config.json quantization_config.quant_method
      trust_remote_code: false
    engine:
      name: vllm
      version: "0.30.0"
      # vllm/vllm-openai:v0.30.0 multi-arch index digest (CUDA 13.0, needs driver >= 580).
      # Its CompressedTensorsW8A8Fp8 scheme needs compute capability 8.9 (L40S sm_89,
      # H100 sm_90). No --quantization flag: vLLM reads the method from config.json
      # (registry pair table: compressed-tensors + fp8).
      image: vllm/vllm-openai@sha256:8a69ffad015f138d7170c4ddc429e230a3bc1c1719f67e14324749df200a4b90
      args: {}
      chat_template_kwargs: {enable_thinking: false}
    hardware:
      gpu: L40S
      gpus_per_replica: 1
      nodes_per_replica: 1
      instance_types: {aws: g6e.xlarge, runpod: l40s-x1}
    parallelism: {tp: 1, pp: 1, ep: 1}
    # Same cap as BF16 so both rows serve the same window.
    max_context: 32768
    quantization: fp8
    kv_cache_dtype: auto
    pricing: null  # not shipped: fp8-kv8's gate is inconclusive (7a8237d0)
    scaling: {min_replicas: 0, max_replicas: 1}
    clouds: [aws, runpod]
    capabilities: {tools: true, json_schema: true, vision: false, reasoning: true}
    tool_call_parsers: {vllm: hermes, sglang: qwen25}
    routing_tier: 1
    status: preview
    base_model: qwen3-8b  # quantization of qwen3-8b: compared with its list prices
