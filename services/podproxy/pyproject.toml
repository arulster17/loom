[project]
name = "loom-podproxy"
version = "0.1.0"
description = "Loom pod proxy: the mTLS front of a serving pod's engine (docs/phase1-contracts.md §9)"
requires-python = ">=3.12"
license = "Apache-2.0"
# Kept small on purpose: this runs on every serving pod, next to the engine.
dependencies = [
    "h11>=0.14",
    "httpx>=0.27",
]

[project.scripts]
loom-podproxy = "loom_podproxy.proxy:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loom_podproxy"]
