[project]
name = "loom"
version = "0.0.0"
description = "Loom: verified-quality, transparent-cost open-model inference"
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "bench",
    "services/platform_common",
    "services/gateway",
    "services/billing",
    "services/podproxy",
    "services/devstack",
    "services/poolmgr",
]

[tool.uv.sources]
loom-bench = { workspace = true }
loom-platform = { workspace = true }
loom-gateway = { workspace = true }
loom-billing = { workspace = true }
loom-podproxy = { workspace = true }
loom-devstack = { workspace = true }
loom-poolmgr = { workspace = true }

[dependency-groups]
dev = [
    "loom-bench[mock,aws]",
    "loom-platform",
    "loom-gateway",
    "loom-billing",
    "loom-podproxy",
    "loom-devstack",
    "loom-poolmgr",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "moto[ec2,s3,ssm,secretsmanager]>=5.0",
    "pytest-xdist>=3.6",
    "openai>=1.50",
    "scipy-stubs>=1.18.1.1",
    "pyarrow-stubs>=20.0.0.20260819",
    "pytest-repeat>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.isort]
known-first-party = [
    "loom_bench",
    "loom_platform",
    "loom_gateway",
    "loom_billing",
    "loom_podproxy",
    "loom_devstack",
    "loom_poolmgr",
]
