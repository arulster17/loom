name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  bench:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: loom
          POSTGRES_PASSWORD: loom
          POSTGRES_DB: loom_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loom" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      LOOM_TEST_DATABASE_URL: postgresql+psycopg://loom:loom@localhost:5432/loom_test
      LOOM_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy bench/src
      - run: uv run mypy services/platform_common/src services/gateway/src services/billing/src
      - run: uv run mypy services/platform_common/src services/podproxy/src services/devstack/src
      - run: uv run mypy services/platform_common/src services/poolmgr/src
      - run: uv run pytest -q -n auto

  # Flake check (plan R15): the test files a PR adds or changes, each test repeated 20
  # times (pytest-repeat) under deliberate CPU load; fails if any test both passed and
  # failed. `flake-files` finds them; `flake-check` is skipped when there are none.
  flake-files:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      files: ${{ steps.diff.outputs.files }}
    steps:
      # The PR's merge commit: parent 1 is the base it merges into.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        run: |
          pattern='^(bench|services/[^/]+)/tests/(.+/)?(test_[^/]*|[^/]*_test)\.py$'
          changed=$(git diff --name-only --diff-filter=d HEAD^1 HEAD)
          files=$(echo "$changed" | grep -E "$pattern" | tr '\n' ' ' || true)
          echo "changed test files: ${files:-none}"
          echo "files=${files}" >> "$GITHUB_OUTPUT"

  flake-check:
    needs: flake-files
    if: needs.flake-files.outputs.files != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: loom
          POSTGRES_PASSWORD: loom
          POSTGRES_DB: loom_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loom" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      LOOM_TEST_DATABASE_URL: postgresql+psycopg://loom:loom@localhost:5432/loom_test
      LOOM_TEST_REDIS_URL: redis://localhost:6379/15
      FLAKE_FILES: ${{ needs.flake-files.outputs.files }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      # 20 runs per test: 10 pytest sessions of `--count 2`. Separate sessions, because
      # pytest-repeat's copies share one module-scoped fixture (an e2e module's whole
      # bench run): each session samples it again. One busy loop per CPU next to
      # `-n auto`'s workers gives each test about half the CPU it would get alone.
      # Sessions stop at the 7-minute limit (SIGINT: pytest still writes its JUnit
      # file; the report warns about tests short of 20 runs). Exit 5: every changed
      # test is network/acceptance, nothing to repeat.
      - name: Changed tests x20 under CPU load
        run: |
          for _ in $(seq "$(nproc)"); do sh -c 'while :; do :; done' & done
          hogs=$(jobs -p)
          set +e
          end=$(( $(date +%s) + 420 ))
          repeat="--count 2 --repeat-scope session"
          stopped=""
          for i in $(seq 10); do
            left=$(( end - $(date +%s) ))
            if [ "$left" -lt 15 ]; then stopped="before session $i"; break; fi
            timeout -k 60 -s INT "$left" .venv/bin/python -m pytest -q -n auto $repeat --junitxml="flake-$i.xml" $FLAKE_FILES
            status=$?
            case $status in
              0|1) ;;
              5) break ;;
              124|137) stopped="in session $i"; break ;;
              *) kill $hogs; echo "pytest exited $status"; exit $status ;;
            esac
          done
          kill $hogs
          if [ -n "$stopped" ]; then echo "::warning::7-minute limit hit $stopped; see the report"; fi
      - name: Report tests that both passed and failed
        run: |
          args="--repeat-count 2 --expect-runs 20"
          title="Flake check: changed tests x20"
          python3 scripts/flaky_report.py $args --title "$title" flake-*.xml | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

  # The pinned pod proxy bundle (docs/phase1-m2-spec.md §9): rebuilt from `git archive
  # HEAD` and the locked wheels (downloaded), it must match config/serving-artifacts.lock.
  # Its own job: it needs the network, the main test job does not.
  podproxy-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run loom-podproxy-bundle --check --out "$RUNNER_TEMP/podproxy-bundle"
      - run: >-
          uv run pytest -q -m network services/podproxy/tests/test_podproxy_bundle.py
          services/podproxy/tests/test_podproxy_bundle_dirty.py

  # The Next.js web app (apps/web): lint, types, unit tests, and the integration tests
  # against a real Postgres, migrated by the platform's own runner (uv run loom-migrate).
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: loom
          POSTGRES_PASSWORD: loom
          POSTGRES_DB: loom
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loom" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # Set, so the integration tests fail (not skip) if Postgres is unreachable.
      LOOM_TEST_DATABASE_URL: postgresql://loom:loom@localhost:5432/loom
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
        working-directory: .
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build

  # M1 and M2 acceptance end to end: the whole compose stack (the pool manager on its local
  # backend, gateway, billing, web, Stripe stub, Mailpit) built from this commit, driven
  # from outside by `loom-m1-acceptance` (docs/phase1-m1-acceptance.md), then
  # `loom-m2-acceptance` (the manager: cold start, pod kill, no capacity, spend cap, idle
  # stop). The pytest twins of these runs are marker-deselected in the `bench` job; this
  # job is where they run. Free: no cloud, no accounts. Ports are moved off the defaults
  # so nothing else on the runner collides.
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: loom-ci
      LOOM_ADMIN_EMAILS: admin@m1.test
      LOOM_PG_PORT: "25432"
      LOOM_REDIS_PORT: "26379"
      LOOM_GATEWAY_PORT: "18080"
      LOOM_GATEWAY_METRICS_PORT: "19100"
      LOOM_BILLING_PORT: "18090"
      LOOM_BILLING_METRICS_PORT: "19101"
      LOOM_STRIPE_STUB_PORT: "22111"
      LOOM_WEB_PORT: "13000"
      LOOM_MAILPIT_UI_PORT: "18025"
      LOOM_MAILPIT_SMTP_PORT: "11025"
      LOOM_POOLMGR_METRICS_PORT: "19102"
      # Every model idles out after 300 s instead of compose's 600, so M2's idle_stop
      # check waits 5 minutes less. M1 acceptance must not see a ready model go cold: its
      # longest stretch without a request to a model is the wait for a killed pod's
      # replacement (~35 s to fail 3 health checks + 120 s unhealthy grace + up to a 15 s
      # tick + a 26 s cold start; 183-196 s in CI). 300 s leaves ~100 s for a slow runner.
      # M2's idle_stop check accepts up to 900 s and waits idle_stop_s + 120 s.
      LOOM_POOLMGR_IDLE_STOP_S: "300"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: M1 acceptance
        run: |
          set -o pipefail
          uv run loom-m1-acceptance --json m1-acceptance.json 2>&1 | tee m1-acceptance.log
      - name: M2 acceptance
        if: always()
        run: |
          set -o pipefail
          uv run loom-m2-acceptance --json m2-acceptance.json 2>&1 | tee m2-acceptance.log
      - name: Stack state and logs
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color --timestamps > compose.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance
          path: |
            m1-acceptance.json
            m1-acceptance.log
            m2-acceptance.json
            m2-acceptance.log
            compose.log
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: docker compose down -v

  # The GPU hosts' client environment rebuilt from uv.lock exactly as RunPod and AWS
  # hosts install it, running every task of every eval suite at 2 items against the mock
  # backend (bench/tests/deps). Catches a missing or broken dependency before a paid run.
  pod-client-env:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -m network -q -s bench/tests/deps
